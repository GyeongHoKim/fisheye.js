<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E2E Test Page</title>
    <script type="importmap">
      {
        "imports": {
          "typegpu": "/node_modules/typegpu/index.js",
          "typegpu/data": "/node_modules/typegpu/data/index.js",
          "typegpu/std": "/node_modules/typegpu/std/index.js",
          "tinyest": "/node_modules/tinyest/index.js",
          "tsover-runtime": "/node_modules/tsover-runtime/dist/index.js",
          "typed-binary": "/node_modules/typed-binary/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <h1>E2E Test Page</h1>
    <script type="module">
      try {
        globalThis.process = { env: { NODE_ENV: "production" } };
        const { Fisheye } = await import("../../dist/index.js");
        window.Fisheye = Fisheye;
        window.webgpuAvailable = !!navigator.gpu;
        window.gpuAdapterInfo = null;
        window.testReady = true;
      } catch (error) {
        window.testError = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
      }
    </script>
  </body>
</html>
